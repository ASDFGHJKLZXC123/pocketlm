name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-static:
    name: app-static
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out recursive submodules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Set up pnpm 10.34.0
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
          version: 10.34.0

      - name: Set up Node.js 22.23.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
          node-version: 22.23.1

      - name: Set up Ruby 3.4.4 for provisioning fixtures
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1
        with:
          bundler-cache: false
          ruby-version: 3.4.4

      - name: Run static application verification
        run: bash scripts/verify-fast.sh

  cpp-linux-debug:
    name: cpp-linux-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out recursive submodules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Isolate native build outputs
        run: echo "POCKETLM_NATIVE_BUILD_ROOT=$RUNNER_TEMP/pocketlm-native" >> "$GITHUB_ENV"

      - name: Install coverage tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes lcov

      - name: Set up CMake 4.4.0 and Ninja 1.13.2
        run: |
          python3 -m venv "$RUNNER_TEMP/pocketlm-cmake"
          "$RUNNER_TEMP/pocketlm-cmake/bin/python" -m pip install \
            --disable-pip-version-check \
            cmake==4.4.0
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/ninja-linux.zip" \
            https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
          echo "5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6  $RUNNER_TEMP/ninja-linux.zip" \
            | sha256sum --check
          unzip -q "$RUNNER_TEMP/ninja-linux.zip" \
            -d "$RUNNER_TEMP/pocketlm-cmake/bin"
          echo "$RUNNER_TEMP/pocketlm-cmake/bin" >> "$GITHUB_PATH"

      - name: Run Debug verification with ASan and coverage
        run: bash scripts/verify-native.sh debug

      - name: Capture PocketLM coverage
        run: |
          lcov --capture \
            --directory "$POCKETLM_NATIVE_BUILD_ROOT/debug" \
            --ignore-errors mismatch \
            --output-file "$RUNNER_TEMP/pocketlm-coverage-raw.info"
          lcov --extract "$RUNNER_TEMP/pocketlm-coverage-raw.info" \
            "$GITHUB_WORKSPACE/cpp/src/*" \
            --output-file "$RUNNER_TEMP/pocketlm-coverage.info"
          lcov --summary "$RUNNER_TEMP/pocketlm-coverage.info"

      - name: Upload PocketLM coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: cpp-linux-debug-coverage
          path: ${{ runner.temp }}/pocketlm-coverage.info
          retention-days: 14

  cpp-linux-release:
    name: cpp-linux-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out recursive submodules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Isolate native build outputs
        run: echo "POCKETLM_NATIVE_BUILD_ROOT=$RUNNER_TEMP/pocketlm-native" >> "$GITHUB_ENV"

      - name: Set up CMake 4.4.0 and Ninja 1.13.2
        run: |
          python3 -m venv "$RUNNER_TEMP/pocketlm-cmake"
          "$RUNNER_TEMP/pocketlm-cmake/bin/python" -m pip install \
            --disable-pip-version-check \
            cmake==4.4.0
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/ninja-linux.zip" \
            https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
          echo "5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6  $RUNNER_TEMP/ninja-linux.zip" \
            | sha256sum --check
          unzip -q "$RUNNER_TEMP/ninja-linux.zip" \
            -d "$RUNNER_TEMP/pocketlm-cmake/bin"
          echo "$RUNNER_TEMP/pocketlm-cmake/bin" >> "$GITHUB_PATH"

      - name: Run Release verification
        run: bash scripts/verify-native.sh release

  cpp-macos:
    name: cpp-macos
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out recursive submodules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Isolate native build outputs
        run: echo "POCKETLM_NATIVE_BUILD_ROOT=$RUNNER_TEMP/pocketlm-native" >> "$GITHUB_ENV"

      - name: Select Xcode 26.4.1
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version

      - name: Set up CMake 4.4.0 and verify Ninja 1.13.2
        run: |
          python3 -m venv "$RUNNER_TEMP/pocketlm-cmake"
          "$RUNNER_TEMP/pocketlm-cmake/bin/python" -m pip install \
            --disable-pip-version-check \
            cmake==4.4.0
          test "$(ninja --version)" = "1.13.2"
          echo "$RUNNER_TEMP/pocketlm-cmake/bin" >> "$GITHUB_PATH"

      - name: Run macOS native verification
        run: bash scripts/verify-native.sh debug

  ios-simulator-build:
    name: ios-simulator-build
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out recursive submodules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Set up pnpm 10.34.0
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
          version: 10.34.0

      - name: Set up Node.js 22.23.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
          node-version: 22.23.1

      - name: Set up Ruby 3.4.4
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1
        with:
          bundler-cache: false
          ruby-version: 3.4.4

      - name: Verify Bundler 4.0.7 from the lockfile
        run: |
          bundle --version
          test "$(bundle --version | awk '{ print $NF }')" = "4.0.7"

      - name: Select Xcode 26.4.1
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version

      - name: Set up CMake 4.4.0 and verify Ninja 1.13.2
        run: |
          python3 -m venv "$RUNNER_TEMP/pocketlm-cmake"
          "$RUNNER_TEMP/pocketlm-cmake/bin/python" -m pip install \
            --disable-pip-version-check \
            cmake==4.4.0
          test "$(ninja --version)" = "1.13.2"
          echo "$RUNNER_TEMP/pocketlm-cmake/bin" >> "$GITHUB_PATH"

      - name: Verify locked pods and a fresh DerivedData build
        run: bash scripts/verify-release.sh ios
