name: Weekly clean bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/weekly-bootstrap.yml
      - .gitmodules
      - .node-version
      - Gemfile
      - Gemfile.lock
      - app/**
      - cpp/**
      - models/**
      - scripts/**
  schedule:
    - cron: "17 9 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-clean-bootstrap
  cancel-in-progress: false

jobs:
  weekly-clean-bootstrap:
    name: weekly uncached clean bootstrap
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Check out a clean recursive clone
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Isolate native build outputs
        run: echo "POCKETLM_NATIVE_BUILD_ROOT=$RUNNER_TEMP/pocketlm-native" >> "$GITHUB_ENV"

      - name: Set up pnpm 10.34.0 without a dependency cache
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
          version: 10.34.0

      - name: Set up Node.js 22.23.1 without a dependency cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1

      - name: Set up Ruby 3.4.4 without a gem cache
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1
        with:
          bundler-cache: false
          ruby-version: 3.4.4

      - name: Verify Bundler 4.0.7 from the lockfile
        run: |
          bundle --version
          test "$(bundle --version | awk '{ print $NF }')" = "4.0.7"

      - name: Select Xcode 26.4.1
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version

      - name: Set up CMake 4.4.0 without a tool cache and verify Ninja 1.13.2
        run: |
          python3 -m venv "$RUNNER_TEMP/pocketlm-cmake"
          "$RUNNER_TEMP/pocketlm-cmake/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            cmake==4.4.0
          test "$(ninja --version)" = "1.13.2"
          echo "$RUNNER_TEMP/pocketlm-cmake/bin" >> "$GITHUB_PATH"

      - name: Run the complete release verification
        run: bash scripts/verify-release.sh all
